<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#004493",
                        "background": "#f8f9fa",
                        "surface-container-high": "#e7e8e9",
                        "on-tertiary-fixed": "#410001",
                        "secondary": "#006e28",
                        "tertiary-fixed-dim": "#ffb4aa",
                        "on-secondary-container": "#00732a",
                        "surface-container": "#edeeef",
                        "surface-bright": "#f8f9fa",
                        "on-tertiary-fixed-variant": "#930005",
                        "outline": "#717786",
                        "surface-tint": "#005bc1",
                        "surface-container-low": "#f3f4f5",
                        "secondary-fixed-dim": "#53e16f",
                        "inverse-on-surface": "#f0f1f2",
                        "outline-variant": "#c1c6d7",
                        "on-tertiary-container": "#fffbff",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "primary-container": "#0070eb",
                        "surface-variant": "#e1e3e4",
                        "error": "#ba1a1a",
                        "inverse-surface": "#2e3132",
                        "on-background": "#191c1d",
                        "on-primary-container": "#fefcff",
                        "on-surface": "#191c1d",
                        "tertiary": "#bc000a",
                        "secondary-fixed": "#72fe88",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#adc6ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#002107",
                        "on-secondary-fixed-variant": "#00531c",
                        "error-container": "#ffdad6",
                        "secondary-container": "#6ffb85",
                        "on-surface-variant": "#414755",
                        "primary-fixed": "#d8e2ff",
                        "primary": "#0058bc",
                        "tertiary-fixed": "#ffdad5",
                        "inverse-primary": "#adc6ff",
                        "surface-container-highest": "#e1e3e4",
                        "tertiary-container": "#e2241f",
                        "on-primary-fixed": "#001a41",
                        "surface-dim": "#d9dadb",
                        "surface": "#f8f9fa"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl fixed top-0 w-full z-50 shadow-sm shadow-blue-900/5 px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden bg-surface-container-high">
<img alt="User Profile" data-alt="close-up portrait of a professional man in a bright modern office setting with soft natural window light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqQKTZTdgEVCMvg5Cc-LZ32Y48imwJV_1jzAD2Qo24wWtdg2ZHNeC4JPkVGHDCgknWna6dg0drjG-yJJnl3Hy73rP8wrGBy-1ymfbdj1c2OEa-rXacllRWd4cC7bs7IEUwiJuAcGePk9UDimWj_Ao5Vr6NDisfFb9dVRQtd0IXX_qg1vlwbOeDr5byM_0q6ABV1ydSXWKXP3Ow-ZmH8rSinrbzo5vWPuG4ue0c4jBsR2O-eUBV2VkO915pM_35z5_qmLJJYB5YLdg"/>
</div>
<h1 class="font-space-grotesk font-bold tracking-tight text-2xl font-black bg-gradient-to-br from-blue-700 to-blue-500 bg-clip-text text-transparent">CivicAI</h1>
</div>
<button class="text-slate-500 dark:text-slate-400 hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-2xl" data-icon="notifications">notifications</span>
</button>
</header>
<main class="flex-grow pt-24 pb-32 px-6 max-w-2xl mx-auto w-full">
<!-- Hero Section: Editorial Typography -->
<section class="mb-10">
<h2 class="font-headline text-5xl font-bold leading-tight tracking-tighter text-on-surface">
                Report <br/> <span class="text-primary">An Issue.</span>
</h2>
<p class="mt-4 text-on-surface-variant font-medium">Help us keep your neighborhood pristine and safe.</p>
</section>
<!-- Media Upload Area -->
<section class="mb-10 relative">
<div class="w-full aspect-[4/3] rounded-xl glass-panel border border-white/40 flex flex-col items-center justify-center cursor-pointer hover:bg-white/90 transition-all group overflow-hidden">
<div class="flex flex-col items-center gap-4 text-primary">
<div class="p-6 rounded-full bg-primary/10 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-5xl" data-icon="add_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_circle</span>
</div>
<span class="font-label font-semibold tracking-widest uppercase text-xs">Upload Evidence</span>
</div>
</div>
<!-- Floating Mic Button -->
<button class="absolute -bottom-6 right-6 w-16 h-16 rounded-full glass-panel shadow-[0_10px_40px_rgba(0,88,188,0.15)] flex items-center justify-center text-primary active:scale-90 transition-transform z-10">
<span class="material-symbols-outlined text-3xl" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</section>
<!-- Issue Categories -->
<section class="mb-10">
<h3 class="font-label text-xs font-bold uppercase tracking-[0.2em] text-on-surface-variant mb-4">Select Category</h3>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-3 rounded-full bg-primary text-on-primary font-semibold text-sm shadow-lg shadow-primary/20 transition-all">Road</button>
<button class="px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-semibold text-sm hover:bg-surface-container-highest transition-all">Waste</button>
<button class="px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-semibold text-sm hover:bg-surface-container-highest transition-all">Safety</button>
<button class="px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-semibold text-sm hover:bg-surface-container-highest transition-all">Water</button>
</div>
</section>
<!-- Description Field -->
<section class="mb-10">
<h3 class="font-label text-xs font-bold uppercase tracking-[0.2em] text-on-surface-variant mb-4">Description</h3>
<div class="relative">
<textarea class="w-full p-6 bg-surface-container-low rounded-lg border-none focus:ring-2 focus:ring-primary/20 min-h-[160px] font-body text-on-surface placeholder:text-outline-variant resize-none" placeholder="Describe the problem in detail..."></textarea>
</div>
</section>
<!-- Location Section -->
<section class="mb-10">
<div class="flex justify-between items-end mb-4">
<h3 class="font-label text-xs font-bold uppercase tracking-[0.2em] text-on-surface-variant">Location</h3>
<button class="flex items-center gap-2 text-primary font-bold text-sm bg-primary-fixed px-4 py-2 rounded-full hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-lg" data-icon="my_location">my_location</span>
                    Auto-detect
                </button>
</div>
<div class="rounded-lg overflow-hidden bg-surface-container-high relative group">
<img alt="Map View" class="w-full h-48 object-cover" data-alt="top-down satellite view of a clean urban street grid with greenery and soft daylight shadows" data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqRrlRTXkOnwyGr1diCC_lUTnoRIIzt3JzHsu-7bIQGYrWONmVhe9zsOLB4_H6BmGlrw9hfTBR9yFqeeZCMkUWP7WOAGEOffNU4jG_th1DXxpahZON66090PsmztOF5Jw_wMbGdyoClv3QOG739Y2j5-OeGZ-PCz4YOGW3bUG25OxrgDDP3T83qhhEnULNuSqGVArZ9BYZV1L2BaS7_vWr-mmc03M25fujwpschf5hChKzMN3Ttf0rwzv4QbEFbiQc1S-r9SG6e9w"/>
<div class="absolute inset-0 bg-primary/5 group-hover:bg-transparent transition-colors"></div>
<div class="absolute bottom-4 left-4 right-4 p-4 glass-panel rounded-lg flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<span class="text-sm font-semibold text-on-surface">242 Civic Plaza, Downtown</span>
</div>
</div>
</section>
<!-- Submit Button -->
<section class="mb-12">
<button class="w-full py-6 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline text-lg font-bold tracking-tight shadow-xl shadow-primary/30 hover:scale-[1.02] active:scale-95 transition-all">
                Submit Issue
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-white/60 dark:bg-slate-900/60 backdrop-blur-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.04)] rounded-t-[3rem]">
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest mt-1">Home</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest mt-1">Map</span>
</div>
<div class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 scale-110 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined" data-icon="add_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest mt-1">Report</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest mt-1">Chat</span>
</div>
<div class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all tap-highlight-none active:scale-90">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest mt-1">Profile</span>
</div>
</nav>
</body></html>
