<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>CivicPulse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0058bc",
              "primary-container": "#0070eb",
              surface: "#f8f9fa",
              "surface-low": "#f3f4f5",
              "surface-high": "#e1e3e4",
              "on-surface": "#191c1d",
              "on-variant": "#414755",
              secondary: "#006e28",
              error: "#ba1a1a",
            },
            fontFamily: {
              headline: ["Space Grotesk", "sans-serif"],
              body: ["Inter", "sans-serif"],
            },
            borderRadius: { lg: "1.5rem", xl: "2rem" },
          },
        },
      };
    </script>
    <style>
      body { font-family: "Inter", sans-serif; background: #f8f9fa; color: #191c1d; }
      h1, h2, h3, .font-headline { font-family: "Space Grotesk", sans-serif; }
      .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400; }
      .material-symbols-outlined.fill { font-variation-settings: "FILL" 1, "wght" 400; }
      .glass { background: rgba(255, 255, 255, 0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
      .glass-strong { background: rgba(255,255,255,0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
      .leaflet-container { border-radius: 1.5rem; font-family: inherit; }
      ::-webkit-scrollbar { width: 0; height: 0; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .mesh-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
      .mesh-bg::before, .mesh-bg::after {
        content: ""; position: absolute; border-radius: 9999px; filter: blur(120px);
      }
      .mesh-bg::before { top: -12%; left: -12%; width: 55%; height: 55%; background: rgba(0,88,188,0.12); }
      .mesh-bg::after { bottom: -12%; right: -12%; width: 55%; height: 55%; background: rgba(0,110,40,0.07); }
      @keyframes sospulse {
        0% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(188,0,10,0.6); }
        70% { transform: scale(1); box-shadow: 0 0 0 34px rgba(188,0,10,0); }
        100% { transform: scale(0.96); box-shadow: 0 0 0 0 rgba(188,0,10,0); }
      }
      .sos-pulse { animation: sospulse 2s infinite; }
      @keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .fadeup { animation: fadeup .35s ease both; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
