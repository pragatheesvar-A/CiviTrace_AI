<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Emergency - CivicAI</title>

          extend: {
            "colors": {
                    "on-secondary": "#ffffff",

                    "on-secondary-container": "#00732a",
                    "surface-container": "#edeeef",
                    "surface-bright": "#f8f9fa",

                    "outline": "#717786",

                    "surface-container-low": "#f3f4f5",
                    "secondary-fixed-dim": "#53e16f",
                    "inverse-on-surface": "#f0f1f2",

                    "on-tertiary-container": "#fffbff",
                    "on-tertiary": "#ffffff",
                    "on-primary": "#ffffff",
                    "primary-container": "#0070eb",
                    "surface-variant": "#e1e3e4",
                    "error": "#ba1a1a",

                    "on-primary-container": "#fefcff",

                    "surface-container-lowest": "#ffffff",

                    "on-secondary-fixed-variant": "#00531c",
                    "error-container": "#ffdad6",
                    "secondary-container": "#6ffb85",
                    "on-surface-variant": "#414755",
                    "primary-fixed": "#d8e2ff",
                    "primary": "#0058bc",
                    "tertiary-fixed": "#ffdad5",
                    "inverse-primary": "#adc6ff",

            "borderRadius": {

            "fontFamily": {
                    "headline": ["Space Grotesk"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sos-pulse {
            box-shadow: 0 0 0 0 rgba(188, 0, 10, 0.4);
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(188, 0, 10, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 40px rgba(188, 0, 10, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(188, 0, 10, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface selection:bg-primary/20">
<!-- Top Navigation Anchor -->
<header class="bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl fixed top-0 w-full z-50 shadow-sm shadow-blue-900/5 px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full overflow-hidden">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="professional portrait of a young man with a friendly expression in a modern office setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAC2g8xhFkrU-MOmFr4dyMJY8ZdExcI8BIwCku_dxHtq_UuLAEG-5bWGIs0QW2-TjEO7qcg0Vv9J6yGW1V4a9MWB_cAuQQIkb94g97PQx5Us7Lt_OgSatleLC5ce5I_MykksIfXkPzFlibqLVxFyCcPWt8eZzW0YGolG-NZeQ_zyr69umWVuJvx11K571P3rCslTSEiwc9HUjo5tIdvvanZ11r0a-LdPnnxPwEERJ5_zg6yen4t5HZT4fDsQKr0w4A9jrWyEXg6aqU"/>
</div>
<h1 class="text-2xl font-black bg-gradient-to-br from-blue-700 to-blue-500 bg-clip-text text-transparent font-headline tracking-tight">CivicAI</h1>
</div>
<button class="text-slate-500 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-2xl">notifications</span>
</button>
</header>
<main class="pt-24 pb-32 px-6 max-w-lg mx-auto min-h-screen flex flex-col items-center">
<!-- Emergency Intent Section -->
<div class="w-full mb-12 text-center">
<h2 class="font-headline text-display-lg text-4xl font-bold tracking-tight text-on-surface mb-2">Emergency Help</h2>
<p class="text-on-surface-variant text-lg">Help is just one tap away.</p>
</div>
<!-- SOS Button: The Central Anchor -->
<div class="relative w-64 h-64 mb-16 flex items-center justify-center">
<div class="absolute inset-0 bg-tertiary/10 rounded-full animate-ping"></div>
<button class="sos-pulse relative w-56 h-56 rounded-full bg-gradient-to-br from-tertiary to-tertiary-container flex flex-col items-center justify-center text-white z-10 active:scale-95 transition-transform duration-200 shadow-2xl">
<span class="material-symbols-outlined text-6xl mb-2" style="font-variation-settings: 'FILL' 1;">emergency_home</span>
<span class="font-headline font-black text-5xl tracking-tighter">SOS</span>
</button>
</div>
<!-- Quick Tap Actions: Asymmetric Bento Grid -->
<div class="grid grid-cols-3 gap-4 w-full mb-12">
<button class="group flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors p-6 rounded-lg aspect-square">
<span class="material-symbols-outlined text-tertiary text-3xl mb-3 group-active:scale-90 transition-transform">car_crash</span>
<span class="font-label font-semibold text-xs tracking-widest text-on-surface uppercase">Accident</span>
</button>
<button class="group flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors p-6 rounded-lg aspect-square">
<span class="material-symbols-outlined text-tertiary text-3xl mb-3 group-active:scale-90 transition-transform">local_fire_department</span>
<span class="font-label font-semibold text-xs tracking-widest text-on-surface uppercase">Fire</span>
</button>
<button class="group flex flex-col items-center justify-center bg-surface-container-low hover:bg-surface-container-high transition-colors p-6 rounded-lg aspect-square">
<span class="material-symbols-outlined text-tertiary text-3xl mb-3 group-active:scale-90 transition-transform">shield_person</span>
<span class="font-label font-semibold text-xs tracking-widest text-on-surface uppercase">Crime</span>
</button>
</div>
<!-- Live Tracking Map: The Glass Card -->
<div class="w-full bg-surface-container-lowest/70 backdrop-blur-xl rounded-xl overflow-hidden shadow-sm shadow-blue-900/5 mb-8">
<div class="px-6 py-4 flex justify-between items-center bg-surface-container-high/30">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="text-xs font-bold uppercase tracking-widest text-on-surface-variant font-label">Live Tracking</span>
</div>
<span class="text-xs font-medium text-primary">Active: 1.2km away</span>
</div>
<div class="relative h-48 w-full overflow-hidden bg-surface-variant">
<img class="w-full h-full object-cover opacity-80 mix-blend-multiply" data-alt="clean minimal digital map interface showing city blocks and a pulsing blue location dot in san francisco" data-location="San Francisco" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCY0t6SCxufXDFiFEejOM2iZbqouvpQIMBk5HelhVkg_-nzb3gVRTZ3ZfHVerzzt5SLaSzOdQWe7fntwNAzj_YiYtXVaDNYOrVmFGU4JxEUSlwugdRZbtylLYK0tAtFOiFFx1N8tLZpWTlZiGI_QKfiDS6p04yuifZrmilg8BmWbnvzybLr6_lI2qDCOvGPwgTmCqXLsaf5QH_Z-pV650zNE_G-bd2bsMUao8sBZtWijgsogzPgiZAnUGK9cdSLqLo7dW9Mw3Bzjuc"/>
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-12 h-12 bg-primary/20 rounded-full flex items-center justify-center">
<div class="w-4 h-4 bg-primary rounded-full ring-4 ring-white"></div>
</div>
</div>
</div>
<div class="p-4 flex items-center gap-4">
<div class="flex-1">
<p class="text-sm font-bold text-on-surface">3 Active Responders</p>
<p class="text-xs text-on-surface-variant">Estimated arrival: 4 mins</p>
</div>
<div class="flex -space-x-2">
<div class="w-8 h-8 rounded-full border-2 border-white bg-slate-200"></div>
<div class="w-8 h-8 rounded-full border-2 border-white bg-slate-300"></div>
<div class="w-8 h-8 rounded-full border-2 border-white bg-slate-400"></div>
</div>
</div>
</div>
<!-- Call Services Secondary -->
<button class="w-full py-5 rounded-full border border-outline-variant/20 bg-surface-container-lowest text-on-surface font-headline font-bold flex items-center justify-center gap-3 hover:bg-surface-container-low transition-all active:scale-95">
<span class="material-symbols-outlined text-primary">call</span>
            Call Emergency Services (911)
        </button>
</main>
<!-- Bottom Navigation Anchor -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-white/60 dark:bg-slate-900/60 backdrop-blur-2xl shadow-[0_-10px_40px_rgba(0,0,0,0.04)] rounded-t-xl">
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all active:scale-90 tap-highlight-none">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all active:scale-90 tap-highlight-none">
<span class="material-symbols-outlined mb-1">map</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest">Map</span>
</button>
<button class="flex flex-col items-center justify-center text-blue-600 dark:text-blue-400 scale-110 active:scale-90 tap-highlight-none">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest">Report</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all active:scale-90 tap-highlight-none">
<span class="material-symbols-outlined mb-1">chat_bubble</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest">Chat</span>
</button>
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 hover:text-blue-500 transition-all active:scale-90 tap-highlight-none">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-inter text-[10px] font-semibold uppercase tracking-widest">Profile</span>
</button>
</nav>
</body></html>
